name: Aqua Code-to-Cloud Security Gates

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:

      report_only:
        description: >-
          Demo mode only: report Aqua and image findings without blocking
          the release. Do not use this for normal production releases.
        required: true
        default: false
        type: boolean

      publish_image:
        description: >-
          Push, sign, and attest the image after all enabled gates.
        required: true
        default: false
        type: boolean


# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: aqua-code-to-cloud-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


# ============================================================
# GITHUB TOKEN PERMISSIONS
# ============================================================

permissions:
  contents: read
  actions: read
  security-events: write


# ============================================================
# GLOBAL ENVIRONMENT
# ============================================================

env:

  IMAGE_REPOSITORY: talibaliaqua/dvga-talibali-cosign

  COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  IMAGE_REF: talibaliaqua/dvga-talibali-cosign:${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  SHOULD_PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_image) }}


# ============================================================
# JOB 1
# SOURCE / IaC / SAST / SECRETS / DEPENDENCIES
# ============================================================

jobs:

  source-security:

    name: 1 - Source, IaC, SAST, secrets, and dependency gate

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Check out exact revision being evaluated
        uses: actions/checkout@v7.0.1

        with:
          ref: ${{ env.COMMIT_SHA }}
          fetch-depth: 0
          persist-credentials: false


      # --------------------------------------------------------
      # AQUA SOURCE + IaC SECURITY GATE
      # --------------------------------------------------------

      - name: Aqua source-code and IaC assurance gate
        uses: docker://aquasec/aqua-scanner

        with:

          args: >-
            trivy fs
            --scanners misconfig,vuln,secret
            --secret-config ./trivy-secret.yaml
            --sast
            --reachability
            .

        env:

          AQUA_KEY: ${{ secrets.AQUA_KEY }}

          AQUA_SECRET: ${{ secrets.AQUA_SECRET }}

          GITHUB_TOKEN: ${{ github.token }}

          TRIVY_RUN_AS_PLUGIN: aqua

          AQUA_ASSURANCE_EXPORT: aqua-assurance.json

          # Normal execution = blocking
          # Manual report_only = reporting only
          TRIVY_SKIP_POLICY_EXIT_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.report_only && 'true' || 'false' }}

          TRIVY_DEBUG: 'false'


          # --------------------------------------------------
          # GITHUB / SCM METADATA
          # --------------------------------------------------

          OVERRIDE_REPOSITORY: ${{ github.repository }}

          OVERRIDE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}

          OVERRIDE_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

          OVERRIDE_SOURCE_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

          OVERRIDE_TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}

          OVERRIDE_COMMIT: ${{ env.COMMIT_SHA }}

          OVERRIDE_PULL_REQUEST_ID: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}

          OVERRIDE_RUN_ID: ${{ github.run_id }}

          OVERRIDE_BUILD_ID: ${{ github.run_number }}

          OVERRIDE_BUILDSYSTEM: GitHub Actions


      # --------------------------------------------------------
      # SOURCE / IaC SARIF
      #
      # Report only. Aqua remains authoritative for the gate.
      # --------------------------------------------------------

      - name: Generate source and IaC SARIF report
        if: ${{ always() }}

        uses: aquasecurity/trivy-action@v0.36.0

        with:

          scan-type: fs

          scan-ref: .

          scanners: vuln,misconfig,secret

          trivy-config: trivy.yaml

          format: sarif

          output: trivy-source-results.sarif

          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

          ignore-unfixed: 'false'

          exit-code: '0'


      # --------------------------------------------------------
      # GITHUB SECURITY
      # --------------------------------------------------------

      - name: Publish source findings to GitHub Security
        if: ${{ always() && hashFiles('trivy-source-results.sarif') != '' }}

        continue-on-error: true

        uses: github/codeql-action/upload-sarif@v4.37.5

        with:

          sarif_file: trivy-source-results.sarif

          category: aqua-source-and-iac


      # --------------------------------------------------------
      # SAVE REPORTS
      # --------------------------------------------------------

      - name: Preserve source scan reports
        if: ${{ always() }}

        uses: actions/upload-artifact@v7.0.1

        with:

          name: source-security-reports-${{ env.COMMIT_SHA }}

          path: |
            aqua-assurance.json
            trivy-source-results.sarif

          if-no-files-found: ignore

          retention-days: 30


  # ============================================================
  # JOB 2
  # BUILD / IMAGE SECURITY / PUBLISH / SIGN / SBOM
  # ============================================================

  build-scan-publish:

    name: 2 - Build, image gate, publish, sign, and attest

    needs:
      - source-security

    runs-on: ubuntu-24.04

    timeout-minutes: 45

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Check out approved revision
        uses: actions/checkout@v7.0.1

        with:

          ref: ${{ env.COMMIT_SHA }}

          fetch-depth: 0

          persist-credentials: false


      # --------------------------------------------------------
      # DOCKER BUILDX
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0


      # --------------------------------------------------------
      # BUILD IMAGE LOCALLY
      #
      # IMPORTANT:
      # Image is NOT pushed yet.
      # Security evaluation happens first.
      # --------------------------------------------------------

      - name: Build image for security evaluation

        uses: docker/build-push-action@v7.3.0

        with:

          context: .

          file: ./Dockerfile

          load: true

          push: false

          pull: true

          tags: ${{ env.IMAGE_REF }}

          cache-from: type=gha

          cache-to: type=gha,mode=max

          provenance: false

          sbom: false


      # ========================================================
      # FULL IMAGE SCAN
      #
      # Purpose:
      # Show ALL findings.
      #
      # This step NEVER blocks the workflow.
      # ========================================================

      - name: Generate complete container-image security report

        if: ${{ always() }}

        uses: aquasecurity/trivy-action@v0.36.0

        with:

          scan-type: image

          image-ref: ${{ env.IMAGE_REF }}

          scanners: vuln,misconfig,secret

          trivy-config: trivy.yaml

          format: table

          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

          ignore-unfixed: 'false'

          exit-code: '0'

          skip-setup-trivy: 'true'


      # --------------------------------------------------------
      # IMAGE SARIF
      # --------------------------------------------------------

      - name: Generate container-image SARIF report

        if: ${{ always() }}

        uses: aquasecurity/trivy-action@v0.36.0

        with:

          scan-type: image

          image-ref: ${{ env.IMAGE_REF }}

          scanners: vuln,misconfig,secret

          trivy-config: trivy.yaml

          format: sarif

          output: trivy-image-results.sarif

          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

          ignore-unfixed: 'false'

          exit-code: '0'

          skip-setup-trivy: 'true'


      # --------------------------------------------------------
      # GITHUB SECURITY
      # --------------------------------------------------------

      - name: Publish image findings to GitHub Security

        if: ${{ always() && hashFiles('trivy-image-results.sarif') != '' }}

        continue-on-error: true

        uses: github/codeql-action/upload-sarif@v4.37.5

        with:

          sarif_file: trivy-image-results.sarif

          category: aqua-container-image


      # ========================================================
      # EXPLICIT SECRET DEMONSTRATION
      #
      # This gives you a clean customer-visible section
      # specifically for embedded secrets.
      # ========================================================

      - name: Demonstrate secrets embedded in image

        if: ${{ always() }}

        uses: aquasecurity/trivy-action@v0.36.0

        with:

          scan-type: image

          image-ref: ${{ env.IMAGE_REF }}

          scanners: secret

          trivy-config: trivy.yaml

          format: table

          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

          exit-code: '0'

          skip-setup-trivy: 'true'


      # ========================================================
      # IMAGE RELEASE GATE
      #
      # IMPORTANT:
      #
      # This step evaluates the actual release policy.
      #
      # HIGH / CRITICAL
      # Known fix required
      #
      # We use continue-on-error temporarily so we can create
      # an explicit customer-friendly PASS / BLOCK decision.
      # ========================================================

      - name: Evaluate container-image release policy

        id: image_gate

        continue-on-error: true

        uses: aquasecurity/trivy-action@v0.36.0

        with:

          scan-type: image

          image-ref: ${{ env.IMAGE_REF }}

          scanners: vuln,misconfig,secret

          trivy-config: trivy.yaml

          format: table

          severity: HIGH,CRITICAL

          ignore-unfixed: 'true'

          exit-code: '1'

          skip-setup-trivy: 'true'


      # ========================================================
      # CAPTURE POLICY DECISION
      # ========================================================

      - name: Capture image gate result

        if: ${{ always() }}

        shell: bash

        run: |

          set -euo pipefail

          if [[ "${{ steps.image_gate.outcome }}" == "failure" ]]; then

            echo "IMAGE_GATE_FAILED=true" >> "${GITHUB_ENV}"

          else

            echo "IMAGE_GATE_FAILED=false" >> "${GITHUB_ENV}"

          fi


          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.report_only }}" == "true" ]]; then

            echo "REPORT_ONLY=true" >> "${GITHUB_ENV}"

          else

            echo "REPORT_ONLY=false" >> "${GITHUB_ENV}"

          fi


      # ========================================================
      # CUSTOMER-FRIENDLY RELEASE DECISION
      # ========================================================

      - name: Display image release decision

        if: ${{ always() }}

        shell: bash

        run: |

          set -euo pipefail

          echo
          echo "============================================================"
          echo "AQUA CONTAINER IMAGE RELEASE DECISION"
          echo "============================================================"
          echo
          echo "Image:"
          echo "${IMAGE_REF}"
          echo
          echo "Policy:"
          echo "  - Vulnerabilities: HIGH, CRITICAL"
          echo "  - Misconfigurations: HIGH, CRITICAL"
          echo "  - Secrets: HIGH, CRITICAL"
          echo "  - Unfixed vulnerabilities: ignored"
          echo


          if [[ "${REPORT_ONLY}" == "true" ]]; then

            echo "MODE: REPORT ONLY"

            if [[ "${IMAGE_GATE_FAILED}" == "true" ]]; then

              echo "RESULT: FINDINGS DETECTED"

              echo "The image would be blocked under normal enforcement."

            else

              echo "RESULT: PASSED"

            fi

            echo "This demonstration run is intentionally non-blocking."

          elif [[ "${IMAGE_GATE_FAILED}" == "true" ]]; then

            echo "MODE: ENFORCING"

            echo "RESULT: BLOCKED"

            echo "The image does not satisfy the release policy."

          else

            echo "MODE: ENFORCING"

            echo "RESULT: PASSED"

            echo "The image satisfies the release policy."

          fi


          echo
          echo "============================================================"


      # ========================================================
      # ACTUAL RELEASE BLOCK
      #
      # This step prevents DockerHub publication.
      # ========================================================

      - name: Block non-compliant container image

        if: ${{ env.IMAGE_GATE_FAILED == 'true' && env.REPORT_ONLY != 'true' }}

        shell: bash

        run: |

          echo
          echo "============================================================"
          echo "RELEASE BLOCKED"
          echo "============================================================"
          echo
          echo "The container image failed the security release policy."
          echo "Remediate the identified findings and rerun the pipeline."
          echo
          echo "============================================================"

          exit 1


      # --------------------------------------------------------
      # SAVE IMAGE REPORT
      # --------------------------------------------------------

      - name: Preserve image scan report

        if: ${{ always() }}

        uses: actions/upload-artifact@v7.0.1

        with:

          name: image-security-report-${{ env.COMMIT_SHA }}

          path: trivy-image-results.sarif

          if-no-files-found: ignore

          retention-days: 30


      # ========================================================
      # REGISTRY PUBLICATION
      #
      # IMPORTANT:
      # These steps execute ONLY when:
      #
      # 1. This is a push to main
      # OR
      # 2. Manual run has publish_image=true
      #
      # AND the release gate has passed.
      # ========================================================

      - name: Log in to Docker Hub

        if: ${{ env.SHOULD_PUBLISH == 'true' && env.IMAGE_GATE_FAILED != 'true' }}

        uses: docker/login-action@v4.6.0

        with:

          username: ${{ secrets.DOCKERHUB_USERNAME }}

          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------------------------
      # PUSH IMAGE
      # --------------------------------------------------------

      - name: Push policy-compliant image

        if: ${{ env.SHOULD_PUBLISH == 'true' && env.IMAGE_GATE_FAILED != 'true' }}

        shell: bash

        run: |

          set -euo pipefail

          echo "Pushing policy-compliant image:"

          echo "${IMAGE_REF}"

          docker push "${IMAGE_REF}"


      # ========================================================
      # RESOLVE IMMUTABLE DIGEST
      # ========================================================

      - name: Resolve immutable image digest

        if: ${{ env.SHOULD_PUBLISH == 'true' && env.IMAGE_GATE_FAILED != 'true' }}

        shell: bash

        run: |

          set -euo pipefail

          IMAGE_DIGEST=""

          for attempt in 1 2 3 4 5; do

            MANIFEST_JSON="$(
              docker buildx imagetools inspect "${IMAGE_REF}" \
                --format '{{json .Manifest}}' 2>/dev/null || true
            )"

            IMAGE_DIGEST="$(
              jq -r '.digest // empty' <<<"${MANIFEST_JSON}" 2>/dev/null || true
            )"

            if [[ -n "${IMAGE_DIGEST}" ]]; then
              break
            fi

            echo "Digest not visible yet; retrying (${attempt}/5)."

            sleep "$((attempt * 2))"

          done


          if [[ -z "${IMAGE_DIGEST}" ]]; then

            echo "Unable to resolve pushed image digest." >&2

            exit 1

          fi


          SIGNED_IMAGE="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"


          echo "IMAGE_DIGEST=${IMAGE_DIGEST}" >> "${GITHUB_ENV}"

          echo "SIGNED_IMAGE=${SIGNED_IMAGE}" >> "${GITHUB_ENV}"


          echo
          echo "Immutable image:"
          echo "${SIGNED_IMAGE}"


      # ========================================================
      # COSIGN
      # ========================================================

      - name: Install Cosign

        if: ${{ env.SHOULD_PUBLISH == 'true' && env.IMAGE_GATE_FAILED != 'true' }}

        uses: sigstore/cosign-installer@v4.1.1

        with:

          cosign-release: 'v3.0.6'


      - name: Show Cosign version

        if: ${{ env.SHOULD_PUBLISH == 'true' && env.IMAGE_GATE_FAILED != 'true' }}

        shell: bash

        run: |

          set -euo pipefail

          cosign version


      # ========================================================
      # SIGN IMAGE
      #
      # Key-based signing for this demo.
      #
      # Transparency-log upload is disabled so the demo is not
      # dependent on Rekor/TUF availability.
      # ========================================================

      - name: Sign immutable image digest

        if: ${{ env.SHOULD_PUBLISH == 'true' && env.IMAGE_GATE_FAILED != 'true' }}

        shell: bash

        env:

          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_KEY }}

          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

          COSIGN_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}

          COSIGN_DOCKER_MEDIA_TYPES: '1'

        run: |

          set -euo pipefail

          echo "Signing immutable image:"

          echo "${SIGNED_IMAGE}"


          cosign sign \
            --yes \
            --tlog-upload=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${SIGNED_IMAGE}"


      # ========================================================
      # CONFIRM SIGNATURE
      # ========================================================

      - name: Confirm signature is attached

        if: ${{ env.SHOULD_PUBLISH == 'true' && env.IMAGE_GATE_FAILED != 'true' }}

        shell: bash

        env:

          COSIGN_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}

          COSIGN_DOCKER_MEDIA_TYPES: '1'

        run: |

          set -euo pipefail

          echo "Cosign signature tree:"

          cosign tree "${SIGNED_IMAGE}"


      # ========================================================
      # VERIFY SIGNATURE
      #
      # Offline verification avoids Rekor/TUF dependency.
      # ========================================================

      - name: Verify image signature

        if: ${{ env.SHOULD_PUBLISH == 'true' && env.IMAGE_GATE_FAILED != 'true' }}

        shell: bash

        env:

          COSIGN_PUB: ${{ secrets.COSIGN_PUB }}

          COSIGN_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}

          COSIGN_DOCKER_MEDIA_TYPES: '1'

        run: |

          set -euo pipefail

          echo "Verifying immutable image:"

          echo "${SIGNED_IMAGE}"


          cosign verify \
            --offline \
            --key env://COSIGN_PUB \
            "${SIGNED_IMAGE}"


      # ========================================================
      # SBOM
      # ========================================================

      - name: Install Billy and generate CycloneDX SBOM

        if: ${{ env.SHOULD_PUBLISH == 'true' && env.IMAGE_GATE_FAILED != 'true' }}

        shell: bash

        env:

          AQUA_KEY: ${{ secrets.AQUA_KEY }}

          AQUA_SECRET: ${{ secrets.AQUA_SECRET }}

          GH_TOKEN: ${{ github.token }}

        run: |

          set -euo pipefail


          curl --fail \
            --silent \
            --show-error \
            --location \
            https://download.codesec.aquasec.com/billy/install.sh \
            --output install.sh


          curl --fail \
            --silent \
            --show-error \
            --location \
            https://github.com/argonsecurity/releases/releases/latest/download/install.sh.checksum \
            --output install.sh.checksum


          EXPECTED_SHA="$(awk 'NF {print $1; exit}' install.sh.checksum)"

          ACTUAL_SHA="$(sha256sum install.sh | awk '{print $1}')"


          if [[ -z "${EXPECTED_SHA}" || "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]]; then

            echo "Billy installer checksum validation failed." >&2

            echo "Expected: ${EXPECTED_SHA:-missing}" >&2

            echo "Actual:   ${ACTUAL_SHA}" >&2

            exit 1

          fi


          chmod +x install.sh

          ./install.sh

          rm -f install.sh install.sh.checksum


          billy generate \
            --access-token "${GH_TOKEN}" \
            --aqua-key "${AQUA_KEY}" \
            --aqua-secret "${AQUA_SECRET}" \
            --artifact-path "${IMAGE_REF}" \
            --report-format sbom \
            --sbom-path sbom.cdx.json


          test -s sbom.cdx.json


      # ========================================================
      # SBOM ATTESTATION
      # ========================================================

      - name: Attest CycloneDX SBOM to image digest

        if: ${{ env.SHOULD_PUBLISH == 'true' && env.IMAGE_GATE_FAILED != 'true' }}

        shell: bash

        env:

          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_KEY }}

          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

          COSIGN_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}

          COSIGN_DOCKER_MEDIA_TYPES: '1'

        run: |

          set -euo pipefail


          cosign attest \
            --yes \
            --tlog-upload=false \
            --key env://COSIGN_PRIVATE_KEY \
            --type cyclonedx \
            --predicate sbom.cdx.json \
            "${SIGNED_IMAGE}"


      # ========================================================
      # VERIFY SBOM ATTESTATION
      # ========================================================

      - name: Verify CycloneDX SBOM attestation

        if: ${{ env.SHOULD_PUBLISH == 'true' && env.IMAGE_GATE_FAILED != 'true' }}

        shell: bash

        env:

          COSIGN_PUB: ${{ secrets.COSIGN_PUB }}

          COSIGN_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}

          COSIGN_DOCKER_MEDIA_TYPES: '1'

        run: |

          set -euo pipefail


          cosign verify-attestation \
            --offline \
            --key env://COSIGN_PUB \
            --type cyclonedx \
            "${SIGNED_IMAGE}"


      # ========================================================
      # PRESERVE SBOM
      # ========================================================

      - name: Preserve generated SBOM

        if: ${{ env.SHOULD_PUBLISH == 'true' && env.IMAGE_GATE_FAILED != 'true' && always() }}

        uses: actions/upload-artifact@v7.0.1

        with:

          name: cyclonedx-sbom-${{ env.COMMIT_SHA }}

          path: sbom.cdx.json

          if-no-files-found: ignore

          retention-days: 90


      # ========================================================
      # FINAL RELEASE SUMMARY
      # ========================================================

      - name: Write release summary

        if: ${{ env.SHOULD_PUBLISH == 'true' && env.IMAGE_GATE_FAILED != 'true' && success() }}

        shell: bash

        run: |

          {
            echo "## Aqua Code-to-Cloud Release"
            echo
            echo "- Image tag: \`${IMAGE_REF}\`"
            echo "- Immutable digest: \`${SIGNED_IMAGE}\`"
            echo "- Source/IaC security gate: passed"
            echo "- Container-image security gate: passed"
            echo "- Image published: yes"
            echo "- Cosign signature: verified"
            echo "- CycloneDX SBOM: generated"
            echo "- CycloneDX SBOM attestation: verified"
          } >> "${GITHUB_STEP_SUMMARY}"
