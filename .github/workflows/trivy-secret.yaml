# Demo-only custom secret rules for the DVGA pipeline.
# These rules detect the synthetic values intentionally embedded in the
# Dockerfile and /opt/dvga/.env. They do not require real provider credentials.
rules:
  - id: dvga-demo-credential
    category: DVGA-Demo
    title: Hard-coded DVGA demo credential
    severity: CRITICAL
    keywords:
      - DVGA_DB_PASSWORD
      - DB_PASSWORD
      - DVGA_API_TOKEN
      - INTERNAL_API_TOKEN
      - DVGA_JWT_SECRET
      - JWT_SECRET
      - DVGA_ENCRYPTION_KEY
      - ENCRYPTION_KEY
    regex: >-
      (?i)(?P<key>(?:DVGA_)?DB_PASSWORD|(?:DVGA_)?API_TOKEN|INTERNAL_API_TOKEN|(?:DVGA_)?JWT_SECRET|(?:DVGA_)?ENCRYPTION_KEY)\s*(?:=|:)\s*["']?(?P<secret>[A-Za-z0-9_./+=-]{16,})["']?
    secret-group-name: secret

  - id: dvga-demo-database-url
    category: DVGA-Demo
    title: Database URL containing embedded credentials
    severity: HIGH
    keywords:
      - DATABASE_URL
      - postgresql://
    regex: >-
      (?i)(?P<key>DATABASE_URL)\s*=\s*["']?postgresql://[^:\s"']+:(?P<secret>[^@\s"']{16,})@
    secret-group-name: secret
